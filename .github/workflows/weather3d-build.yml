name: Build Miguel Sky 3D APK
on:
  push:
    branches: [ weather3d-apk ]
    paths: [ 'weather3d/**', '.github/workflows/weather3d-build.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: weather3d
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Miguel-Sky-3D-APK
          path: weather3d/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
